# Azure Developer CLI (azd) configuration for Contract Intelligence
name: contract-intelligence
metadata:
  template: contract-intelligence@0.0.1

# Infrastructure configuration
infra:
  provider: bicep
  path: infra
  module: main.azd
  parameters:
    location: ${AZURE_LOCATION=eastus2}
    # ${VAR=default} syntax is the well-tested azd substitution path. The env://
    # form was attempted but azd 1.21.3 silently resolves it to empty for these
    # params, which then caused ARM to try to provision NEW postgres / openai
    # accounts instead of reusing the existing ones in this tenant.
    existingOpenAiEndpoint: ${EXISTING_OPENAI_ENDPOINT=}
    existingOpenAiDeploymentName: ${EXISTING_OPENAI_DEPLOYMENT_NAME=}
    existingOpenAiEmbeddingDeploymentName: ${EXISTING_OPENAI_EMBEDDING_DEPLOYMENT_NAME=}
    existingOpenAiResourceId: ${EXISTING_OPENAI_RESOURCE_ID=}
    existingPostgresHost: ${EXISTING_POSTGRES_HOST=}
    existingPostgresDatabase: ${EXISTING_POSTGRES_DATABASE=}
    existingPostgresUser: ${EXISTING_POSTGRES_USER=}
    existingPostgresPassword: ${EXISTING_POSTGRES_PASSWORD=}
    postgresAdminPassword: ${POSTGRES_ADMIN_PASSWORD=}
    hierarchyLinkerEnabled: ${HIERARCHYLINKERENABLED=auto}
    hierarchyLinkerShadowMode: ${HIERARCHYLINKERSHADOWMODE=false}
    hierarchyLinkerRetrainJobEnabled: ${HIERARCHYLINKERRETRAINJOBENABLED=false}

# Services to deploy
services:
  backend:
    project: .
    language: python
    host: containerapp
    docker:
      path: ./Dockerfile
      context: .

# Deployment hooks
hooks:
  preprovision:
    posix:
      run: pwsh -File ./infra/scripts/preprovision.ps1
    windows:
      run: pwsh -File ./infra/scripts/preprovision.ps1
  postprovision:
    posix:
      run: pwsh -File ./infra/scripts/postprovision.ps1
    windows:
      run: pwsh -File ./infra/scripts/postprovision.ps1

# Environment configuration - Set these in .azure/<env-name>/.env to reuse existing resources
