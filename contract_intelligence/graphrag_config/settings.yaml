### GraphRAG v3 Configuration ###
### Migrated from v2 on 2026-02-23 ###
### Uses LiteLLM + pgvector (shared PostgreSQL instance) ###

encoding_model: cl100k_base
skip_workflows: []

# --- Language Models (v3: separate completion + embedding sections) ---
completion_models:
  default_completion_model:
    api_key: ${AZURE_OPENAI_API_KEY}
    type: litellm
    model_provider: azure
    model: gpt-4o
    call_args:
      max_completion_tokens: 4000
    api_base: https://eastus2oai.openai.azure.com/
    api_version: 2024-12-01-preview
    azure_deployment_name: gpt-5.1
    retry:
      type: exponential_backoff
      max_retries: 5
    rate_limit:
      type: sliding_window
      requests_per_period: 60
      tokens_per_period: 80000

embedding_models:
  default_embedding_model:
    api_key: ${AZURE_OPENAI_API_KEY}
    type: litellm
    model_provider: azure
    model: text-embedding-3-small
    api_base: https://eastus2oai.openai.azure.com/
    api_version: 2024-12-01-preview
    azure_deployment_name: ${EMBEDDING_DEPLOYMENT_NAME}

# --- Chunking (v3: group_by_columns removed) ---
chunking:
  type: tokens
  size: 1200
  overlap: 100

# --- Input ---
input:
  type: text
  file_pattern: ".*\\.md$$"
  storage:
    type: file
    base_dir: "data/input"

# --- Output Storage ---
output:
  type: file
  base_dir: "data/output"

# --- Cache ---
cache:
  type: json
  storage:
    type: file
    base_dir: "cache"

# --- Reporting ---
reporting:
  type: file
  base_dir: "logs"

# --- Graph Extraction ---
extract_graph:
  prompt: "prompts/entity_extraction.txt"
  entity_types: [
    "Contract",
    "Party",
    "Clause",
    "Obligation",
    "Right",
    "Term",
    "Condition",
    "Jurisdiction",
    "MonetaryValue",
    "Risk"
  ]
  max_gleanings: 1

# --- Description Summarization ---
summarize_descriptions:
  prompt: "prompts/summarize_descriptions.txt"
  max_length: 500

# --- Claim Extraction ---
extract_claims:
  enabled: true
  prompt: "prompts/claim_extraction.txt"
  description: "Extract contractual obligations, rights, and key terms."
  max_gleanings: 1

# --- Community Reports ---
community_reports:
  prompt: "prompts/community_report.txt"
  max_length: 2000
  max_input_length: 8000

# --- Graph Clustering ---
cluster_graph:
  max_cluster_size: 10

# --- Snapshots ---
snapshots:
  graphml: false
  raw_graph: true

# --- Vector Store (v3: flattened, custom pgvector support) ---
# NOTE: By default uses lancedb for CLI indexing.
# Our custom PgVectorStore is registered at runtime by graphrag_agent.py
# To use pgvector, run indexing via our Python API (graphrag_ingestion.py)
vector_store:
  type: lancedb
  db_uri: data/output/lancedb
  vector_size: 1536
  index_schema:
    entity_description:
      index_name: "entity_description"
      vector_size: 1536
    text_unit_text:
      index_name: "text_unit_text"
      vector_size: 1536
    community_full_content:
      index_name: "community_full_content"
      vector_size: 1536

# --- Text Embedding ---
embed_text:
  names:
    - entity_description
    - text_unit_text
    - community_full_content

# --- Local Search ---
local_search:
  text_unit_prop: 0.5
  community_prop: 0.1
  conversation_history_max_turns: 5
  top_k_entities: 10
  top_k_relationships: 10
  max_context_tokens: 12000

# --- Global Search ---
global_search:
  data_max_tokens: 12000
  map_max_length: 1000
  reduce_max_length: 2000

# --- DRIFT Search (new in v2+) ---
drift_search:
  drift_k_followups: 3
  primer_folds: 3
  n_depth: 2

# --- Basic Search (new in v3) ---
basic_search:
  k: 20
  max_context_tokens: 8000
  concurrency: 32
