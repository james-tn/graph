[project]
name = "contract-intelligence"
version = "0.1.0"
description = "Hybrid Contract Intelligence Platform using GraphRAG and PostgreSQL"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi",
    "uvicorn",
    "pydantic",
    "python-dotenv",
    "asyncpg",
    "pgvector",
    "openai>=1.50.0",
    "azure-identity",
    "psycopg2-binary>=2.9",
    "graphrag>=3.0.2",
    "agent-framework>=1.0.0rc1",
    "numpy",
    "PyPDF2",
    "pdf2image",
    "pytesseract",
    "docling",
    "Pillow",
]

[project.optional-dependencies]
# ML hierarchy linker. Install with: `pip install -e .[hierarchy-linker]`
# Optional so deployments without ML fallback don't pay the wheel cost.
hierarchy-linker = [
    "xgboost>=2.0.0",
    "scikit-learn>=1.3.0",
    "pandas>=2.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["backend"]

[tool.uv]
dev-dependencies = []
prerelease = "allow"
